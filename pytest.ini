[pytest]
addopts = --browser chromium --screenshot only-on-failure --video retain-on-failure --tracing retain-on-failure -v
testpaths = tests
base_url = https://www.saucedemo.com
# report log level
log_level = INFO
# console log level
log_cli = true
log_cli_level = INFO

