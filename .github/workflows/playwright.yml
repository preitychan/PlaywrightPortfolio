name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_path:
        description: "Test path, file, or marker expression to run (e.g. tests/test_auth.py or -k 'cart')"
        required: false
        default: ""
        type: string

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          #cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Set report timestamp
        run: echo "REPORT_DIR=playwright-report-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Run tests
        run: pytest --tracing retain-on-failure --html=${{ env.REPORT_DIR }}/report.html --self-contained-html ${{ github.event.inputs.test_path }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_DIR }}
          path: |
            test-results/
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 7

